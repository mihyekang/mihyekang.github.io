<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정리를 정리하기</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --bg: #060912;
      --surface: #0d1426;
      --border: #1e2d4a;
      --accent1: #00d4ff;
      --accent2: #ff3d8b;
      --accent3: #7c3aed;
      --text: #e2e8f0;
      --muted: #64748b;
      --aws-orange: #ff9900;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 10% 20%, rgba(0,212,255,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 80%, rgba(124,58,237,0.07) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* NAV */
    nav {
      padding: 2.4rem 0 2.8rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-meta {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* POST LIST */
    .post-list {
      padding: 2rem 0 4rem;
    }

    .post-list-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }
    .post-list-header .label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .post-list-header .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--border), transparent);
    }
    .post-list-header .count {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent1);
      opacity: 0.6;
    }

    .post-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.4rem 1.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.18s, background 0.18s;
      cursor: pointer;
    }
    .post-item:hover {
      border-color: rgba(0,212,255,0.3);
      background: rgba(13,20,38,0.95);
    }

    .post-left { flex: 1; min-width: 0; }

    .post-tag {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--aws-orange);
      border: 1px solid rgba(255,153,0,0.25);
      padding: 2px 7px;
      border-radius: 3px;
      margin-bottom: 8px;
    }

    .post-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.5;
    }

    .post-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .post-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .post-arrow {
      font-size: 0.75rem;
      color: var(--accent1);
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
      transform: translateX(-4px);
    }
    .post-item:hover .post-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* FOOTER */
    footer {
      padding: 2rem 0 2.8rem;
      border-top: 1px solid var(--border);
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
<div class="wrap">

    </a>

      <div class="post-left">
        <span class="post-tag">AWS Summit 2026</span>

      </div>
      <div class="post-right">
        <span class="post-date">2026.05.21</span>
        <span class="post-arrow">→</span>
      </div>
    </a>

    <!-- Post 1: agentic legacy -->
    <a href="2026-05-21-aws-summit-agentic-legacy.html" class="post-item">

      </div>
      <div class="post-right">
        <span class="post-date">2026.05.21</span>
        <span class="post-arrow">→</span>
      </div>
    </a>

  </div>

  <footer>
    정리를 정리하기 · Organized with Claude
  </footer>

</div>
</body>
</html>
